<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berkeley City Council Districts</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .map-title {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            color: #333;
        }
        .leaflet-popup-content {
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([37.8717, -122.2728], 13);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        // Roster mapped to the exact string matches found in your "title" properties
        const councilRoster = {
            "District 1": "Rashi Kesarwani",
            "District 2": "Terry Taplin",
            "District 3": "Ben Bartlett",
            "District 4": "Igor Tregub",
            "District 5": "Shoshana O'Keefe",
            "District 6": "Brent Blackaby",
            "District 7": "Cecilia Lunaparra",
            "District 8": "Mark Humbert"
        };

        // Style function: Matches the exact string "District 1" from the title property
        function styleDistrict(feature) {
            const districtTitle = feature.properties && feature.properties.title;
            const isDistrict1 = (districtTitle === "District 1");

            return {
                color: isDistrict1 ? "#800080" : "#3388ff", // Clean purple outline for District 1
                weight: isDistrict1 ? 4 : 2,                // Slightly heavier border for D1
                opacity: 0.8,
                fillColor: isDistrict1 ? "#800080" : "#3388ff", 
                fillOpacity: isDistrict1 ? 0.25 : 0.1       // Enhanced tint for District 1
            };
        }

        // Interaction function: Binds the popups cleanly using the title property
        function onEachFeature(feature, layer) {
            if (feature.properties && feature.properties.title) {
                const districtTitle = feature.properties.title;
                const memberName = councilRoster[districtTitle] || "Vacant / Unknown";
                
                const popupContent = `
                    <strong>${districtTitle}</strong><br/>
                    <span style="color: #555;">Councilmember: ${memberName}</span>
                `;
                layer.bindPopup(popupContent);
            }
        }

        // Fetch and load your GeoJSON file
        fetch('CouncilDistricts.json')
            .then(response => {
                if (!response.ok) throw new Error("Could not read CouncilDistricts.json");
                return response.json();
            })
            .then(geojsonData => {
                L.geoJSON(geojsonData, {
                    style: styleDistrict,
                    onEachFeature: onEachFeature
                }).addTo(map);
            })
            .catch(error => {
                console.error("Error loading map data:", error);
            });

        const titleControl = L.control({position: 'topright'});
        titleControl.onAdd = function () {
            const div = L.DomUtil.create('div', 'map-title');
            div.innerHTML = 'Berkeley City Council Districts';
            return div;
        };
        titleControl.addTo(map);

    </script>
</body>
</html>
